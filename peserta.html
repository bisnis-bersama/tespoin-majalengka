<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approval Peserta — DPD TESPOIN Majalengka</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 24px #00000010}
h1{font-size:22px;margin:0 0 6px}.sub{font-size:13px;color:#777;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{padding:12px;border-radius:10px;text-align:center;background:#eee}.stat span{font-size:11px}.stat b{display:block;font-size:24px;margin-top:5px}.wait{background:#fff1c4;color:#866600}.ok{background:#d8f6e2;color:#087b25}
.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button,.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:bold;cursor:pointer}.tabs button{background:#ddd}.tabs button.active{background:#111;color:#f5c400}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:12px;font-size:15px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#111;color:#f5c400;text-align:left;padding:11px;font-size:12px}td{padding:10px 8px;border-bottom:1px solid #eee;font-size:13px}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold;background:#eee}.badge.wait{background:#fff1c4;color:#866600}.badge.ok{background:#d8f6e2;color:#087b25}
.approve{background:#f5c400;color:#111}.approve:disabled{opacity:.55;cursor:wait}.muted{color:#777;text-align:center;padding:20px}.msg{font-size:13px;margin:10px 0;overflow-wrap:anywhere}.err{color:#b00020}.good{color:#087b25}
@media(max-width:600px){.wrap{padding:8px}.card{padding:12px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px 4px}.stat b{font-size:20px}.tabs button{flex:1;padding:9px 4px;font-size:11px}}
</style>
</head>
<body>
<div class="wrap"><section class="card">
<h1>DATA PESERTA</h1>
<div class="sub">DPD TESPOIN MAJALENGKA — Approval pembayaran peserta</div>
<div class="stats">
  <div class="stat"><span>TOTAL PESERTA</span><b id="total">—</b></div>
  <div class="stat wait"><span>BELUM LUNAS</span><b id="belum">—</b></div>
  <div class="stat ok"><span>SUDAH LUNAS</span><b id="lunas">—</b></div>
</div>
<div class="tabs">
  <button id="tabBelum" class="active" onclick="pilihTab('belum')">BELUM LUNAS</button>
  <button id="tabLunas" onclick="pilihTab('lunas')">SUDAH LUNAS</button>
</div>
<input id="cari" placeholder="Cari kode, nama, toko, atau WhatsApp..." oninput="render()">
<div id="info" class="msg">Memeriksa sesi aplikasi…</div>
<div class="table-wrap"><table><thead><tr><th>KODE</th><th>NAMA</th><th>TOKO</th><th>WHATSAPP</th><th>NOMINAL</th><th>STATUS</th><th>AKSI</th></tr></thead>
<tbody id="tbody"><tr><td colspan="7" class="muted">Memuat data…</td></tr></tbody></table></div>
<div id="hasil" class="msg" aria-live="polite"></div>
</section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={
 apiKey:"AIzaSyBL_AE-ckPgJOhJX4XUYC04nBvfPdNDppQ",
 authDomain:"register-peserta.firebaseapp.com",
 projectId:"register-peserta",
 storageBucket:"register-peserta.firebasestorage.app",
 messagingSenderId:"983090504866",
 appId:"1:983090504866:web:7879b0784b9fecad4863fb"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);
let role='',all=[],tab='belum',busy=new Set();
const norm=v=>String(v||'').trim().toLowerCase();
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rupiah(v){const n=Number(v);return Number.isFinite(n)&&n>0?'Rp '+n.toLocaleString('id-ID'):'—';}
function mapDoc(doc){const d=doc.data()||{};return {...d,_id:doc.id,kode:d.kode||doc.id,nama:d.nama||'',toko:d.toko||d.namaToko||'',wa:d.wa||d.noWa||'',statusPembayaran:d.statusPembayaran||'BELUM LUNAS',nominalPembayaran:d.nominalPembayaran??d.hargaFinal??'',estimasiNominal:d.estimasiNominal??d.estimasiHarga??150000};}
function paid(p){return norm(p.statusPembayaran)==='lunas';}
function summary(){$('total').textContent=all.length.toLocaleString('id-ID');$('belum').textContent=all.filter(p=>!paid(p)).length.toLocaleString('id-ID');$('lunas').textContent=all.filter(p=>paid(p)).length.toLocaleString('id-ID');}
function pilihTab(t){tab=t;$('tabBelum').classList.toggle('active',t==='belum');$('tabLunas').classList.toggle('active',t==='lunas');$('cari').value='';render();}
function render(){
 const q=$('cari').value.trim().toLowerCase();
 const rows=all.filter(p=>(tab==='belum'?!paid(p):paid(p))&&(!q||[p.kode,p.nama,p.toko,p.wa].some(v=>String(v||'').toLowerCase().includes(q))));
 if(!rows.length){$('tbody').innerHTML='<tr><td colspan="7" class="muted">Tidak ada peserta pada kategori ini.</td></tr>';return;}
 $('tbody').innerHTML=rows.map(p=>{
   const isPaid=paid(p),nominal=isPaid?rupiah(p.nominalPembayaran):'Estimasi '+rupiah(p.estimasiNominal);
   const action=!isPaid&&role==='admin'
    ?'<button class="btn approve" data-approve="'+esc(p._id)+'" '+(busy.has(p._id)?'disabled':'')+'>'+(busy.has(p._id)?'MENYIMPAN…':'SETUJUI LUNAS')+'</button>'
    :isPaid?'<span class="badge ok">LUNAS</span>':'<span class="badge">Khusus Admin</span>';
   return '<tr><td>'+esc(p.kode)+'</td><td>'+esc(p.nama)+'</td><td>'+esc(p.toko)+'</td><td>'+esc(p.wa)+'</td><td>'+esc(nominal)+'</td><td><span class="badge '+(isPaid?'ok':'wait')+'">'+(isPaid?'LUNAS':'BELUM LUNAS')+'</span></td><td>'+action+'</td></tr>';
 }).join('');
}
async function loadRoleAndData(){
 $('info').className='msg';$('info').textContent='Memeriksa sesi login aplikasi…';
 try{
   const user=await new Promise(resolve=>{
     if(auth.currentUser)return resolve(auth.currentUser);
     let unsub=auth.onAuthStateChanged(u=>{if(unsub)unsub();resolve(u);});
   });
   if(!user){
     role=norm(sessionStorage.getItem('tespoin_role'));
     $('info').textContent=role?'Role dari sesi aplikasi: '+role+'.':'Sesi Firebase belum terbaca. Halaman tidak mengalihkan ke halaman login.';
   }else{
     try{
       const us=await db.collection('users').doc(user.uid).get();
       role=us.exists?norm(us.data().role):norm(sessionStorage.getItem('tespoin_role'));
     }catch(e){role=norm(sessionStorage.getItem('tespoin_role'));console.warn('Role Firestore tidak terbaca:',e);}
     $('info').textContent='Sesi aktif'+(user.email?' • '+user.email:'')+' • Role: '+(role||'tidak terdeteksi')+'.';
   }
   await loadParticipants();
 }catch(e){
   console.error(e);$('info').className='msg err';$('info').textContent='Gagal memeriksa sesi: '+(e.message||e);
 }
}
async function loadParticipants(){
 $('tbody').innerHTML='<tr><td colspan="7" class="muted">Memuat data peserta dari Firestore…</td></tr>';
 try{
   const snap=await db.collection('peserta').get();
   all=snap.docs.map(mapDoc);
   all.sort((a,b)=>{const x=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;const y=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;return y-x;});
   summary();render();
 }catch(e){
   console.error('Gagal memuat peserta:',e);
   $('info').className='msg err';
   $('info').textContent='Firestore menolak pembacaan data ('+(e.code||'error')+'): '+(e.message||e)+'. Periksa Firestore Rules untuk koleksi peserta; ini bukan masalah tombol approval.';
   $('tbody').innerHTML='<tr><td colspan="7" class="muted">Data tidak dapat dibaca karena izin Firestore.</td></tr>';
   ['total','belum','lunas'].forEach(id=>$(id).textContent='ERR');
 }
}
async function approve(id){
 if(role!=='admin'){alert('Approval hanya bisa dilakukan oleh akun Admin.');return;}
 const p=all.find(x=>x._id===id);if(!p||paid(p))return;
 if(!confirm('Ubah status pembayaran '+(p.nama||p.kode)+' dari BELUM LUNAS menjadi LUNAS?'))return;
 busy.add(id);render();$('hasil').className='msg';$('hasil').textContent='Menyimpan status pembayaran…';
 try{
   const ref=db.collection('peserta').doc(id);
   await ref.update({statusPembayaran:'LUNAS'});
   all=all.map(x=>x._id===id?{...x,statusPembayaran:'LUNAS'}:x);
   summary();render();$('hasil').className='msg good';$('hasil').textContent='Berhasil: status '+(p.nama||p.kode)+' berubah menjadi LUNAS.';
 }catch(e){
   console.error('Approval gagal:',e);$('hasil').className='msg err';
   $('hasil').textContent=e.code==='permission-denied'?'Firestore menolak perubahan status. Periksa Rules update dokumen peserta khusus Admin.':(e.message||'Gagal mengubah status pembayaran.');
 }finally{busy.delete(id);render();}
}
$('tbody').addEventListener('click',e=>{const b=e.target.closest('[data-approve]');if(b)approve(b.dataset.approve);});
window.pilihTab=pilihTab;window.render=render;
loadRoleAndData();
</script>
</body></html>
