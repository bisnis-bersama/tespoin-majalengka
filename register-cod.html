<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrasi COD Panitia - TESPOIN Majalengka</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#222}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}.head{text-align:center;background:#111;color:#fff;padding:18px;border-radius:14px;margin-bottom:16px}.head h1{margin:0;color:#f5c400;font-size:22px}.field{margin:13px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:15px}button{padding:13px;border:0;border-radius:9px;background:#f5c400;font-weight:800;width:100%;margin-top:10px;cursor:pointer}button:disabled{opacity:.5}.price{background:#111;color:#f5c400;padding:14px;text-align:center;border-radius:12px;font-size:23px;font-weight:800}.note{font-size:13px;line-height:1.5;background:#fff7d5;padding:12px;border-radius:8px;margin:12px 0}.msg{margin-top:12px;font-weight:700}.err{color:#b00020}.ok{color:#087b25}.hidden{display:none}.links{display:flex;gap:10px;margin-top:14px}.links a{flex:1;text-align:center;padding:10px;background:#eee;border-radius:8px;text-decoration:none;color:#222;font-size:13px}</style></head>
<body><div class="wrap"><header class="head"><h1>REGISTRASI PESERTA COD</h1><div>DPD TESPOIN MAJALENGKA</div></header><main class="card"><div class="note">Registrasi COD hanya dapat dilakukan pada tanggal acara dan harus dilakukan oleh panitia yang sudah login. Peserta langsung tercatat LUNAS sesuai harga COD yang ditetapkan.</div><div class="price" id="harga">Memuat harga COD...</div><form id="form"><div class="field"><label>Nama Peserta *</label><input id="nama" required></div><div class="field"><label>Nama Toko</label><input id="toko"></div><div class="field"><label>WhatsApp *</label><input id="wa" type="tel" required></div><div class="field"><label>Alamat *</label><textarea id="alamat" required></textarea></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Ukuran Kaos *</label><select id="ukuran" required><option value="">Pilih ukuran</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option><option>XXXXL</option></select></div><button id="submit" type="submit">DAFTARKAN COD</button></form><div id="msg" class="msg"></div><div class="links"><a href="peserta.html">Data Peserta</a><a href="index-admin.html">Dashboard</a></div></main></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyBL_AE-ckPgJOhJX4XUYC04nBvfPdNDppQ",authDomain:"register-peserta.firebaseapp.com",projectId:"register-peserta",storageBucket:"register-peserta.firebasestorage.app",messagingSenderId:"983090504866",appId:"1:983090504866:web:7879b0784b9fecad4863fb"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();let user=null,role='',settings={},codPrice=0;
const $=id=>document.getElementById(id);function normWa(v){let n=String(v||'').replace(/\D/g,'');return n.startsWith('62')?n:n.startsWith('0')?'62'+n.slice(1):n}function normEmail(v){return String(v||'').trim().toLowerCase()}function dayKey(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(v)}function setMsg(t,err){$('msg').textContent=t;$('msg').className='msg '+(err?'err':'ok')}
async function init(){user=await new Promise(resolve=>{const u=auth.onAuthStateChanged(x=>{u();resolve(x)})});if(!user){location.replace('login-panitia.html');return}const us=await db.collection('users').doc(user.uid).get();role=us.exists?String(us.data().role||'').toLowerCase():'';if(!['admin','owner'].includes(role)){alert('Akses hanya untuk Admin atau Owner.');location.replace('login-panitia.html');return}const snap=await db.collection('pengaturan').doc('acara').get();if(!snap.exists)throw new Error('Pengaturan acara belum tersedia.');settings=snap.data()||{};const today=dayKey(new Date()),event=String(settings.tanggalAcara||settings.tanggal||'').slice(0,10);codPrice=Number(String(settings.codHarga||'').replace(/[^0-9]/g,''))||0;$('harga').textContent='Harga COD: Rp '+codPrice.toLocaleString('id-ID');if(today!==event||codPrice<=0){$('submit').disabled=true;setMsg(today!==event?'Registrasi COD hanya tersedia pada tanggal acara ('+event+').':'Harga COD belum diatur pada Pengaturan.',true)}}
function keyEmail(v){return encodeURIComponent(normEmail(v))}function makeCode(){return 'COD-'+Date.now().toString().slice(-8)+'-'+Math.floor(100+Math.random()*900)}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!user||!['admin','owner'].includes(role))return;const b=$('submit');b.disabled=true;try{if(dayKey(new Date())!==String(settings.tanggalAcara||settings.tanggal||'').slice(0,10))throw new Error('COD hanya dapat dilakukan pada tanggal acara.');if(codPrice<=0)throw new Error('Harga COD belum diatur.');const nama=$('nama').value.trim(),toko=$('toko').value.trim(),wa=$('wa').value.trim(),waNormalized=normWa(wa),alamat=$('alamat').value.trim(),email=normEmail($('email').value),ukuran=$('ukuran').value;if(!nama||!wa||!alamat||!ukuran)throw new Error('Lengkapi nama, WhatsApp, alamat, dan ukuran kaos.');if(waNormalized.length<10)throw new Error('Nomor WhatsApp tidak valid.');const kode=makeCode(),now=firebase.firestore.FieldValue.serverTimestamp(),p={kode,nama,toko,wa,waNormalized,alamat,email,ukuran,buktiTransfer:'',buktiNama:'',buktiTeks:'',statusPembayaran:'LUNAS',nominalPembayaran:codPrice,estimasiNominal:codPrice,tierRegistrasi:'COD',tierPembayaran:'COD',hargaFinal:codPrice,metodePembayaran:'COD',tanggalVerifikasi:now,petugasPembayaran:user.email||user.uid,waktuPembayaran:now,petugasVerifikasi:user.email||user.uid,waktuVerifikasi:now,statusKehadiran:'BELUM HADIR',statusBenefit:'BELUM DIAMBIL',createdAt:now};const batch=db.batch();batch.set(db.collection('peserta').doc(kode),p);batch.set(db.collection('uniqueWa').doc(waNormalized),{waNormalized,kode,createdAt:now});if(email)batch.set(db.collection('uniqueEmail').doc(keyEmail(email)),{email,kode,createdAt:now});await batch.commit();setMsg('Registrasi COD berhasil. Kode: '+kode+' — LUNAS Rp '+codPrice.toLocaleString('id-ID'),false);$('form').reset();}catch(err){console.error(err);setMsg(err.message||'Registrasi COD gagal. Periksa Rules Firebase.',true)}finally{b.disabled=false}});
init().catch(e=>{console.error(e);setMsg(e.message||'Gagal memuat pengaturan.',true)});
</script></body></html>
