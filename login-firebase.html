<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin - DPD TESPOIN Majalengka</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;font-family:Arial,sans-serif;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.3)}
.logo{display:block;width:90px;height:90px;object-fit:contain;margin:0 auto 10px}
h1{text-align:center;font-size:22px;margin:5px 0}.sub{text-align:center;color:#777;font-size:13px;margin-bottom:24px}
label{display:block;font-weight:800;font-size:13px;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:11px;background:#f5c400;color:#111;font-size:16px;font-weight:900}
button:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:13px;font-weight:700}.error{background:#ffe4e4;color:#a00000}
.info{margin-top:20px;background:#fff8d8;border-left:4px solid #f5c400;padding:11px;font-size:12px;color:#666}
.back{display:block;text-align:center;margin-top:17px;color:#777;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<h1>DPD TESPOIN MAJALENGKA</h1>
<div class="sub">LOGIN ADMIN / PANITIA</div>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="btnLogin" type="submit">MASUK</button>
</form>
<div id="msg" class="msg"></div>
<div class="info">Halaman ini khusus admin/panitia. Peserta tidak perlu login.</div>
<a href="index.html" class="back">← Kembali ke halaman peserta</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyBL_AE-ckPgJOhJX4xUYC04nBvfPdNDppQ",
 authDomain: "register-peserta.firebaseapp.com",
 projectId: "register-peserta",
 storageBucket: "register-peserta.firebasestorage.app",
 messagingSenderId: "983090504866",
 appId: "1:983090504866:web:7879b0784b9fecad4863fb"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function showError(text){
 const m=document.getElementById('msg');
 m.textContent=text;
 m.className='msg error';
 m.style.display='block';
}

async function cekRoleDanMasuk(user){
 const snap=await db.collection('users').doc(user.uid).get();
 if(!snap.exists){
  await auth.signOut();
  showError('Akun belum memiliki data role Owner/Admin.');
  return false;
 }
 const data=snap.data()||{};
 const role=String(data.role||'').toLowerCase();
 if(role!=='admin' && role!=='owner'){
  await auth.signOut();
  showError('Akun ini tidak memiliki akses panitia.');
  return false;
 }
 sessionStorage.setItem('tespoin_admin_login','1');
 sessionStorage.setItem('tespoin_admin_user',user.email||'');
 sessionStorage.setItem('tespoin_role',role);
 location.href='index-admin.html';
 return true;
}

auth.onAuthStateChanged(async function(user){
 if(!user) return;
 try{ await cekRoleDanMasuk(user); }
 catch(err){
  console.error(err);
  await auth.signOut();
  showError('Gagal memeriksa akses akun. Coba lagi.');
 }
});

document.getElementById('loginForm').addEventListener('submit',async function(e){
 e.preventDefault();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const b=document.getElementById('btnLogin');
 b.disabled=true;b.textContent='MEMERIKSA...';
 document.getElementById('msg').style.display='none';
 try{
  const cred=await auth.signInWithEmailAndPassword(email,password);
  await cekRoleDanMasuk(cred.user);
 }catch(err){
  console.error(err);
  let pesan='Email atau password salah.';
  if(err.code==='auth/too-many-requests') pesan='Terlalu banyak percobaan login. Coba lagi beberapa saat.';
  else if(err.code==='auth/invalid-email') pesan='Format email tidak valid.';
  showError(pesan);
  b.disabled=false;b.textContent='MASUK';
 }
});
</script>
</body></html>
