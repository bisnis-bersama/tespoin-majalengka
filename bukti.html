<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek Bukti Registrasi - DPD TESPOIN Majalengka</title>
<link rel="stylesheet" href="style.css">
<style>
  .lookup-form{display:grid;gap:12px;margin:18px 0}
  .lookup-form input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
  .lookup-form button{padding:13px;border:0;border-radius:10px;background:#ffc107;color:#111;font-weight:800;cursor:pointer}
  .lookup-form button:disabled{opacity:.6;cursor:wait}
  #status{margin-top:12px;font-weight:700}
  #status.error{color:#b00020} #status.ok{color:#087b25}
  #result{display:none;text-align:left;margin-top:20px}
  .data-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #eee}
  .data-row span{color:#666}.data-row b{text-align:right;overflow-wrap:anywhere}
  #qr{display:flex;justify-content:center;min-height:0;margin:18px auto}
  #qr img,#qr canvas{max-width:220px;height:auto}
  @media print{header,.lookup-form,#status,.print-btn{display:none!important}body{background:#fff}.card{box-shadow:none!important}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">BUKTI REGISTRASI</div><a href="index.html">Beranda</a></div></header>
<div class="container">
  <div class="card" style="max-width:600px;margin:auto;text-align:center">
    <h1>Cek Bukti Registrasi</h1>
    <p class="muted">Masukkan Email atau No. WhatsApp yang digunakan saat registrasi.</p>
    <form id="lookupForm" class="lookup-form">
      <input id="keyword" type="text" autocomplete="off" required placeholder="Email atau 08xxxxxxxxxx">
      <button id="lookupButton" type="submit">CEK REGISTRASI</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="result">
      <h2 style="text-align:center">BUKTI REGISTRASI PESERTA</h2>
      <div id="paymentBadge" style="text-align:center;font-weight:800;margin:10px 0"></div>
      <div id="qr"></div>
      <div id="dataRows"></div>
      <p class="muted">Simpan bukti ini untuk registrasi ulang. QR Code berisi kode registrasi.</p>
      <button id="saveJpgButton" class="print-btn" type="button">SIMPAN BUKTI JPG</button>
      <button class="print-btn" type="button" onclick="window.print()">CETAK / SIMPAN PDF</button>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/*
  Halaman ini memakai Firebase Callable Cloud Function bernama:
  cariBuktiRegistrasi
  Fungsi server harus memvalidasi pencarian dan hanya mengembalikan data
  peserta yang cocok. Jangan membuka read seluruh koleksi peserta ke publik.
*/
const firebaseConfig = {
  apiKey: "AIzaSyBL_AE-ckPgJOhJX4xUYC04nBvfPdNDppQ", 
  authDomain: "register-peserta.firebaseapp.com",
  projectId: "register-peserta",
  storageBucket: "register-peserta.firebasestorage.app",
  messagingSenderId: "983090504866",
  appId: "1:983090504866:web:7879b0784b9fecad4863fb"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const functions = firebase.app().functions("asia-southeast1");

const form = document.getElementById("lookupForm");
const button = document.getElementById("lookupButton");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

function normalizeWa(value) {
  let n = String(value || "").replace(/\D/g, "");
  if (n.startsWith("0")) n = "62" + n.slice(1);
  return n;
}
function showStatus(message, error=false) {
  statusEl.textContent = message || "";
  statusEl.className = error ? "error" : "ok";
}
function addRow(label, value) {
  const row = document.createElement("div");
  row.className = "data-row";
  const left = document.createElement("span");
  left.textContent = label;
  const right = document.createElement("b");
  right.textContent = value == null || value === "" ? "-" : String(value);
  row.append(left, right);
  document.getElementById("dataRows").appendChild(row);
}
function renderParticipant(p) {
  const kode = p.kode || p.kodeRegistrasi || "";
  if (!kode) throw new Error("Data peserta tidak memiliki kode registrasi.");
  document.getElementById("dataRows").replaceChildren();
  document.getElementById("qr").replaceChildren();
  document.getElementById("paymentBadge").textContent =
    "STATUS PEMBAYARAN: " + (p.statusPembayaran || "BELUM LUNAS");
  addRow("Kode Registrasi", kode);
  addRow("Nama Peserta", p.nama);
  addRow("Nama Toko", p.toko);
  addRow("No. WhatsApp", p.wa);
  addRow("Alamat", p.alamat);
  addRow("Email", p.email);
  addRow("Ukuran Kaos", p.ukuran);
  addRow("Status Pembayaran", p.statusPembayaran);
  addRow("Nominal Pembayaran", p.nominalPembayaran ? "Rp " + Number(p.nominalPembayaran).toLocaleString("id-ID") : "Belum diverifikasi");
  const qrBox = document.getElementById("qr");
  new QRCode(qrBox, {text:kode, width:220, height:220, correctLevel:QRCode.CorrectLevel.H});
  resultEl.style.display = "block";

  const saveButton = document.getElementById("saveJpgButton");
  saveButton.onclick = async () => {
    const oldText = saveButton.textContent;
    saveButton.disabled = true;
    saveButton.textContent = "MEMBUAT JPG...";
    try {
      // Beri waktu agar QR Code selesai dirender sebelum diambil gambarnya.
      await new Promise(resolve => setTimeout(resolve, 200));
      const canvas = await html2canvas(resultEl, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        ignoreElements: element => element.classList && element.classList.contains("print-btn")
      });
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/jpeg", 0.95);
      link.download = kode + "-BUKTI-REGISTRASI.jpg";
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch (error) {
      console.error(error);
      showStatus("Gagal menyimpan JPG. Silakan gunakan tombol Cetak / Simpan PDF.", true);
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = oldText;
    }
  };
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const keyword = document.getElementById("keyword").value.trim();
  if (!keyword) return;
  button.disabled = true;
  button.textContent = "MENCARI...";
  resultEl.style.display = "none";
  showStatus("");
  try {
    if (!auth.currentUser) await auth.signInAnonymously();
    const callable = functions.httpsCallable("cariBuktiRegistrasi");
    const response = await callable({
      keyword: keyword.includes("@") ? keyword.toLowerCase() : normalizeWa(keyword)
    });
    const p = response.data && (response.data.peserta || response.data);
    if (!p || !(p.kode || p.kodeRegistrasi)) throw new Error("Data registrasi tidak ditemukan.");
    renderParticipant(p);
    showStatus("Data registrasi ditemukan.");
  } catch (error) {
    console.error(error);
    const code = error && error.code;
    if (code === "functions/not-found") {
      showStatus("Data registrasi tidak ditemukan. Periksa kembali Email atau WhatsApp.", true);
    } else if (code === "functions/unavailable" || code === "functions/internal") {
      showStatus("Layanan pencarian Firebase belum siap atau terjadi kesalahan server.", true);
    } else if (code === "functions/unauthenticated") {
      showStatus("Autentikasi Firebase gagal. Coba muat ulang halaman.", true);
    } else {
      showStatus(error.message || "Pencarian gagal. Periksa konfigurasi Firebase.", true);
    }
  } finally {
    button.disabled = false;
    button.textContent = "CEK REGISTRASI";
  }
});
</script>
</body>
</html>
