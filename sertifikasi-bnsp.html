<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Registrasi BNSP</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:16px;color:#172033}
.wrap{max-width:560px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 24px #0001}
h1{font-size:23px;margin:0 0 8px}p{color:#586579;font-size:14px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:85px;resize:vertical}
button{width:100%;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:700;font-size:16px;padding:14px;margin-top:20px}
button:disabled{opacity:.6}
small{color:#687588;font-weight:normal}
#status{margin-top:14px;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>Form Registrasi BNSP</h1>
<p>Isi data sesuai KTP. Dokumen PDF dan bukti transfer maksimal 10 MB per file.</p>
<form id="regForm">
<label>Nama sesuai KTP</label>
<input name="name" required autocomplete="name" style="text-transform:uppercase">

<label>NIK KTP <small>(16 digit)</small></label>
<input name="nik" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required>

<label>Alamat sesuai KTP</label>
<textarea name="address" required></textarea>

<label>Kota/Kabupaten</label>
<input name="city" required style="text-transform:uppercase">

<label>Email</label>
<input name="email" type="email" required autocomplete="email">

<label>Ukuran T-shirt</label>
<select name="tshirtSize" required>
<option value="">Pilih ukuran</option>
<option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option>
</select>

<label>Dokumen persyaratan <small>(PDF)</small></label>
<input name="documentPdf" type="file" accept="application/pdf" required>

<label>Bukti transfer <small>(PDF, JPG, atau PNG)</small></label>
<input name="transferProof" type="file" accept="application/pdf,image/jpeg,image/png" required>

<label style="font-weight:normal"><input type="checkbox" required style="width:auto"> Saya memastikan data yang saya isi benar.</label>
<button id="submitBtn" type="submit">KIRIM REGISTRASI</button>
<div id="status" role="status"></div>
</form>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwow909N7_osEMJLapuX0Wl7yJhfOgXClCcV9yAyWDgyJTalv-3aC3hkqyX18FepnLcSg/exec";
const form = document.getElementById("regForm");
const statusBox = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

form.elements.name.addEventListener("input", e => e.target.value = e.target.value.toUpperCase());
form.elements.city.addEventListener("input", e => e.target.value = e.target.value.toUpperCase());

function fileToPayload(file) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error("File belum dipilih."));
    if (file.size > 10 * 1024 * 1024) return reject(new Error(file.name + " melebihi 10 MB."));
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result);
      resolve({
        name: file.name,
        mimeType: file.type,
        base64: result.split(",")[1]
      });
    };
    reader.onerror = () => reject(new Error("Gagal membaca file " + file.name));
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  if (!form.reportValidity()) return;

  const nik = form.elements.nik.value.trim();
  if (!/^\d{16}$/.test(nik)) {
    statusBox.textContent = "NIK harus 16 digit angka.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Mengirim...";
  statusBox.textContent = "Sedang menyiapkan dokumen dan mengirim registrasi. Jangan tutup halaman.";

  try {
    const documentPdf = await fileToPayload(form.elements.documentPdf.files[0]);
    const transferProof = await fileToPayload(form.elements.transferProof.files[0]);

    const payload = {
      name: form.elements.name.value.trim().toUpperCase(),
      nik,
      address: form.elements.address.value.trim(),
      city: form.elements.city.value.trim().toUpperCase(),
      email: form.elements.email.value.trim(),
      tshirtSize: form.elements.tshirtSize.value,
      documentPdf,
      transferProof
    };

    // POST text/plain avoids a browser CORS preflight; Apps Script may still
    // return a redirect/CORS response that the browser cannot read.
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    statusBox.textContent =
      "Permintaan sudah dikirim dari browser. Karena mode no-cors tidak dapat membaca balasan server, status penyimpanan belum bisa dipastikan. Periksa Spreadsheet dan kedua folder Drive sebelum mengirim ulang.";
  } catch (err) {
    statusBox.textContent = "Pengiriman gagal: " + (err.message || err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "KIRIM REGISTRASI";
  }
});
</script>
</body>
</html>
