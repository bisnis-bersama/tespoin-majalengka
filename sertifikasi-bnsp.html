<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Registrasi BNSP</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:16px;color:#172033}.wrap{max-width:560px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 24px #0001}h1{font-size:23px;margin:0 0 8px}p{color:#586579;font-size:14px;line-height:1.5}label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:9px;font-size:16px;background:#fff}textarea{min-height:85px;resize:vertical}button{width:100%;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:700;font-size:16px;padding:14px;margin-top:20px}button:disabled{opacity:.6}small{color:#687588;font-weight:normal}#status{margin-top:14px;font-size:14px;white-space:pre-wrap}.success{color:#137333}.error{color:#b3261e}.progress{height:7px;background:#e6eaf0;border-radius:20px;overflow:hidden;margin-top:12px;display:none}.bar{height:100%;width:0;background:#155eef;transition:width .2s} .modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modalbox{background:white;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center}.modalbox h2{margin-top:0;color:#137333}.modalbox button{margin-top:12px}</style></head><body><div class="wrap"><h1>Form Registrasi BNSP</h1><p>Isi data sesuai KTP. Dokumen PDF dan bukti transfer maksimal 10 MB per file.</p>
<form id="regForm"><label>Nama sesuai KTP</label><input name="name" required autocomplete="name" style="text-transform:uppercase"><label>NIK KTP <small>(16 digit)</small></label><input name="nik" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required><label>Alamat sesuai KTP</label><textarea name="address" required></textarea><label>Kota/Kabupaten</label><input name="city" required style="text-transform:uppercase"><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Ukuran T-shirt</label><select name="tshirtSize" required><option value="">Pilih ukuran</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option></select><label>Dokumen persyaratan <small>(PDF)</small></label><input name="documentPdf" type="file" accept="application/pdf" required><label>Bukti transfer <small>(PDF, JPG, atau PNG)</small></label><input name="transferProof" type="file" accept="application/pdf,image/jpeg,image/png" required><label style="font-weight:normal"><input type="checkbox" required style="width:auto"> Saya memastikan data yang saya isi benar.</label><button id="submitBtn" type="submit">KIRIM REGISTRASI</button><div class="progress" id="progress"><div class="bar" id="bar"></div></div><div id="status" role="status"></div></form></div>
<div class="modal" id="successModal" role="dialog" aria-modal="true"><div class="modalbox"><h2>Registrasi Berhasil</h2><p>Data peserta berhasil disimpan ke Google Sheets dan dokumen berhasil diproses.</p><button id="closeModal">OK</button></div></div>
<script>
const form=document.getElementById('regForm'),btn=document.getElementById('submitBtn'),statusBox=document.getElementById('status'),progress=document.getElementById('progress'),bar=document.getElementById('bar'),modal=document.getElementById('successModal');let busy=false;
form.elements.name.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());form.elements.city.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
function fileToPayload(file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error('File belum dipilih.'));if(file.size>10*1024*1024)return reject(new Error(file.name+' melebihi 10 MB.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||'application/octet-stream',base64:String(reader.result).split(',')[1]});reader.onerror=()=>reject(new Error('Gagal membaca file '+file.name));reader.readAsDataURL(file);});}
function setProgress(p,msg){progress.style.display='block';bar.style.width=Math.max(0,Math.min(100,p))+'%';statusBox.textContent=msg;}
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwow909N7_osEMJLapuX0Wl7yJhfOgXClCcV9yAyWDgyJTalv-3aC3hkqyX18FepnLcSg/exec';
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!form.reportValidity())return;const nik=form.elements.nik.value.trim();if(!/^\d{16}$/.test(nik)){statusBox.className='error';statusBox.textContent='NIK harus 16 digit angka.';return;}busy=true;btn.disabled=true;btn.textContent='MENYIAPKAN FILE...';statusBox.className='';setProgress(8,'Membaca dokumen... Jangan tutup halaman.');try{const doc=await fileToPayload(form.elements.documentPdf.files[0]);setProgress(30,'Dokumen terbaca. Membaca bukti transfer...');const proof=await fileToPayload(form.elements.transferProof.files[0]);const payload={name:form.elements.name.value.trim().toUpperCase(),nik,address:form.elements.address.value.trim(),city:form.elements.city.value.trim().toUpperCase(),email:form.elements.email.value.trim(),tshirtSize:form.elements.tshirtSize.value,documentPdf:doc,transferProof:proof};setProgress(55,'Mengirim registrasi...');btn.textContent='SEDANG MENGIRIM...';await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
// Setelah request selesai (dan sesuai alur backend awal yang telah diuji pengguna),
// hentikan indikator, kosongkan form, lalu tampilkan popup sukses.
form.reset();progress.style.display='none';bar.style.width='0%';busy=false;btn.disabled=false;btn.textContent='KIRIM REGISTRASI';statusBox.className='success';statusBox.textContent='Registrasi telah dikirim. Formulir siap untuk peserta berikutnya.';modal.querySelector('h2').textContent='Registrasi Berhasil';modal.querySelector('p').textContent='Formulir sudah dikosongkan dan siap digunakan kembali.';modal.style.display='flex';}catch(err){busy=false;btn.disabled=false;btn.textContent='KIRIM REGISTRASI';statusBox.className='error';statusBox.textContent='Gagal mengirim: '+err.message+'. Formulir tidak dikosongkan.';}});
document.getElementById('closeModal').addEventListener('click',()=>{modal.style.display='none';});
</script></body></html>
