<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrasi Ulang - DPD TESPOIN Majalengka</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:720px;margin:auto;padding:16px}
.header{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}
.header h1{margin:0;color:#f5c400;font-size:22px}
.header p{margin:6px 0 0;color:#ddd;font-size:13px}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:15px;box-shadow:0 3px 15px rgba(0,0,0,.07)}
#reader{width:100%;max-width:560px;margin:auto;overflow:hidden;border-radius:14px;background:#111}
#reader video{width:100%!important;height:auto!important;max-height:70vh;object-fit:cover;border-radius:14px}
#reader img{max-width:100%}
#reader__scan_region{min-height:250px}
.scan-guide{margin-top:12px;background:#111;color:#fff;border-radius:12px;padding:13px 12px;text-align:center;font-size:14px;font-weight:800;line-height:1.5}
.scan-guide.ready{background:#0b7d2b}.scan-guide.warning{background:#9a7100}.scan-guide.error{background:#a40000}
.camera-status{text-align:center;padding:10px 5px 4px;font-size:13px;color:#666;line-height:1.5}
.camera-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{border:0;border-radius:10px;padding:13px 15px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.btn{background:#f5c400;color:#111}.btn-dark{background:#111;color:#fff}
.scan-note{text-align:center;color:#777;font-size:12px;margin-top:10px;line-height:1.5}
.manual{display:flex;gap:8px;margin-top:15px}
.manual input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.result{display:none;margin-top:16px;padding:15px;border-radius:12px}
.ok{background:#e9f8ed;border:1px solid #b9e5c3}
.warn{background:#fff3cd;border:1px solid #f0d98a}
.err{background:#ffe6e6;color:#9b0000;border:1px solid #f0bcbc}
.title{font-size:20px;font-weight:900;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px}
.row:last-child{border-bottom:0}.row span{color:#666}.row b{text-align:right;word-break:break-word}
.status{display:inline-block;padding:5px 9px;border-radius:15px;font-size:11px;font-weight:900}
.lunas,.hadir{background:#dff5e4;color:#087b25}.belum{background:#fff3cd;color:#856404}.belumhadir{background:#eee;color:#555}
.benefit-ok,.benefit-warning{margin-top:15px;padding:13px;border-radius:10px;background:#fff;font-weight:800;line-height:1.5}
.benefit-ok{border:1px solid #b9e5c3;color:#087b25}.benefit-warning{border:1px solid #e0c86b;color:#856404}
.back{display:block;text-align:center;margin-top:18px;color:#666;text-decoration:none;font-size:14px;padding:12px}
@keyframes pulseScan{0%,100%{opacity:.65}50%{opacity:1}}.scanning{animation:pulseScan 1.5s infinite}
@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}.manual{display:block}.manual button{width:100%;margin-top:8px}.camera-actions{grid-template-columns:1fr}.row{align-items:flex-start}.row b{max-width:58%}#reader{border-radius:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>REGISTRASI ULANG</h1>
    <p>DPD TESPOIN MAJALENGKA</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="scanGuide" class="scan-guide">📱 Arahkan QR peserta ke tengah kamera</div>
    <div id="cameraStatus" class="camera-status">Kamera belum aktif. Tekan <b>BUKA KAMERA</b>.</div>
    <div class="camera-actions">
      <button class="btn" id="btnCamera" type="button" onclick="bukaKamera()">📷 BUKA KAMERA</button>
      <button class="btn-dark" id="btnStop" type="button" onclick="tutupKamera()" disabled>■ TUTUP KAMERA</button>
    </div>
    <div class="scan-note">Arahkan QR ke tengah kamera.<br>Jika QR terlalu kecil, dekatkan HP. Jika QR memenuhi layar, jauhkan sedikit.</div>
    <div class="manual">
      <input id="kodeManual" type="text" autocomplete="off" autocapitalize="characters" placeholder="Masukkan kode registrasi" aria-label="Kode registrasi peserta">
      <button type="button" class="btn" id="btnCekManual" onclick="cekManual()">CEK</button>
    </div>
    <div id="result" class="result"></div>
  </div>
  <a class="back" href="index-admin.html">← Kembali ke Dashboard Admin</a>
</div>

<script>
/* Firebase project yang sama dengan login-panitia.html */
const firebaseConfig = {
  apiKey: "AIzaSyBL_AE-ckPgJOhJX4xUYC04nBvfPdNDppQ",
  authDomain: "register-peserta.firebaseapp.com",
  projectId: "register-peserta",
  storageBucket: "register-peserta.firebasestorage.app",
  messagingSenderId: "983090504866",
  appId: "1:983090504866:web:7879b0784b9fecad4863fb"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentRole = '';
let aksesSiap = false;
let sedangProses = false;
let scanner = null;
let kameraAktif = false;
let timerPetunjuk = null;
let waktuMulaiScan = 0;

function tungguAuth(){
  return new Promise(resolve => {
    const unsub = auth.onAuthStateChanged(user => { unsub(); resolve(user); });
  });
}

async function requireStaff(){
  try {
    const user = await tungguAuth();
    if (!user) {
      location.href = 'login-panitia.html';
      return false;
    }
    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists) {
      alert('Akun belum memiliki role Owner/Admin.');
      await auth.signOut();
      location.href = 'login-panitia.html';
      return false;
    }
    currentRole = String(snap.data().role || '').trim().toLowerCase();
    if (currentRole !== 'owner' && currentRole !== 'admin') {
      alert('Akses hanya untuk Owner atau Admin.');
      await auth.signOut();
      location.href = 'login-panitia.html';
      return false;
    }
    aksesSiap = true;
    setCameraStatus('Akun ' + currentRole.toUpperCase() + ' terverifikasi. Kamera siap digunakan.');
    return true;
  } catch (e) {
    console.error(e);
    alert('Gagal memeriksa akses akun: ' + (e.message || ''));
    location.href = 'login-panitia.html';
    return false;
  }
}

function setGuide(text, type=''){
  const el = document.getElementById('scanGuide');
  el.className = 'scan-guide ' + type;
  el.textContent = text;
}
function setCameraStatus(text, error=false){
  const el = document.getElementById('cameraStatus');
  el.textContent = text;
  el.style.color = error ? '#b00000' : '#666';
}
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function mulaiPetunjuk(){
  clearInterval(timerPetunjuk);
  waktuMulaiScan = Date.now();
  setGuide('📱 ARAHKAN QR KE TENGAH KAMERA');
  timerPetunjuk = setInterval(() => {
    if (!kameraAktif || sedangProses) return;
    const detik = Math.floor((Date.now() - waktuMulaiScan) / 1000);
    if (detik < 3) setGuide('📱 ARAHKAN QR KE TENGAH KAMERA');
    else if (detik < 7) setGuide('🔍 QR BELUM TERBACA — DEKATKAN QR SEDIKIT','warning');
    else if (detik < 12) setGuide('↔️ JIKA QR TERLALU BESAR, JAUHKAN HP SEDIKIT','warning');
    else setGuide('⚠ QR BELUM TERBACA — LURUSKAN QR DAN ATUR JARAK','warning');
  }, 3000);
}
function stopPetunjuk(){ clearInterval(timerPetunjuk); timerPetunjuk = null; }

async function bukaKamera(){
  if (!aksesSiap) { alert('Akses akun belum siap.'); return; }
  if (kameraAktif || sedangProses) return;
  if (!window.isSecureContext) {
    setCameraStatus('Kamera membutuhkan koneksi HTTPS.', true);
    setGuide('⚠ HALAMAN HARUS HTTPS','error');
    return;
  }
  const btn = document.getElementById('btnCamera');
  btn.disabled = true;
  try {
    setCameraStatus('Membuka kamera...');
    setGuide('📷 MEMBUKA KAMERA...');
    scanner = new Html5Qrcode('reader');
    const qrbox = (w,h) => {
      const size = Math.max(180, Math.min(360, Math.floor(Math.min(w,h)*0.72)));
      return {width:size,height:size};
    };
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox, aspectRatio: 1.333334, disableFlip: true },
      onScanSuccess,
      onScanFailure
    );
    kameraAktif = true;
    document.getElementById('btnStop').disabled = false;
    setCameraStatus('✓ Kamera aktif. Kamera belakang digunakan.');
    mulaiPetunjuk();
  } catch(e) {
    console.error(e);
    btn.disabled = false;
    let pesan = 'Kamera tidak dapat dibuka.';
    if (e.name === 'NotAllowedError') pesan = 'Izin kamera ditolak. Izinkan akses kamera di pengaturan Chrome.';
    else if (e.name === 'NotFoundError') pesan = 'Kamera tidak ditemukan.';
    else if (e.name === 'NotReadableError') pesan = 'Kamera sedang digunakan aplikasi lain.';
    else if (e.message) pesan += ' ' + e.message;
    setCameraStatus(pesan, true);
    setGuide('❌ KAMERA TIDAK DAPAT DIGUNAKAN','error');
    if (scanner) { try { await scanner.clear(); } catch(_) {} scanner = null; }
  }
}
async function tutupKamera(){
  stopPetunjuk();
  try {
    if (scanner) {
      if (kameraAktif) await scanner.stop();
      await scanner.clear();
    }
  } catch(e) { console.warn(e); }
  scanner = null;
  kameraAktif = false;
  document.getElementById('reader').innerHTML = '';
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnCamera').disabled = false;
  setCameraStatus('Kamera ditutup. Tekan BUKA KAMERA untuk memulai lagi.');
  setGuide('📱 ARAHKAN QR KE TENGAH KAMERA');
}
function onScanSuccess(decodedText){
  if (sedangProses) return;
  stopPetunjuk();
  setGuide('✓ QR TERBACA — MEMERIKSA DATA...','ready');
  setCameraStatus('QR berhasil terbaca. Mohon tunggu...');
  prosesKode(decodedText);
}
function onScanFailure(){}

function cekManual(){
  const input = document.getElementById('kodeManual');
  const tombol = document.getElementById('btnCekManual');
  const kode = input.value.trim();
  if (!kode) {
    tampil('<div class="title">⚠ KODE BELUM DIISI</div><div>Masukkan kode registrasi peserta.</div>','warn');
    input.focus();
    return;
  }
  if (!aksesSiap) {
    tampil('<div class="title">⏳ AKSES BELUM SIAP</div><div>Tunggu pemeriksaan akun selesai.</div>','warn');
    return;
  }
  if (sedangProses) return;
  tombol.disabled = true;
  tombol.textContent = 'MEMERIKSA...';
  prosesKode(kode).finally(() => {
    tombol.disabled = false;
    tombol.textContent = 'CEK';
  });
}
document.getElementById('kodeManual').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); cekManual(); }
});

async function cariPesertaFirestore(kode){
  const input = String(kode || '').trim();
  const candidates = [];
  try {
    if (/^https?:\/\//i.test(input)) {
      const u = new URL(input);
      const param = u.searchParams.get('kode') || u.searchParams.get('code') || u.searchParams.get('id');
      if (param) candidates.push(param.trim());
      const seg = u.pathname.split('/').filter(Boolean).pop();
      if (seg) candidates.push(decodeURIComponent(seg));
    }
  } catch(_) {}
  candidates.push(input);
  const unik = [...new Set(candidates.map(v => String(v).trim()).filter(Boolean))];

  for (const kodeCari of unik) {
    // Coba ID persis dahulu, tanpa mengubah kapitalisasi ID.
    const byId = await db.collection('peserta').doc(kodeCari).get();
    if (byId.exists) {
      const d = byId.data() || {};
      return {...d, _docId:byId.id, kode:d.kode || d.kodeRegistrasi || d.kodePendaftaran || byId.id};
    }
    // Field kode dicoba persis, lalu kapital.
    for (const nilai of [...new Set([kodeCari, kodeCari.toUpperCase()])]) {
      for (const field of ['kode','kodeRegistrasi','kodePendaftaran','registrationCode']) {
        const snap = await db.collection('peserta').where(field,'==',nilai).limit(1).get();
        if (!snap.empty) {
          const doc = snap.docs[0], d = doc.data() || {};
          return {...d, _docId:doc.id, kode:d.kode || d.kodeRegistrasi || d.kodePendaftaran || doc.id};
        }
      }
    }
  }
  return null;
}

async function prosesKode(kode){
  if (!aksesSiap) {
    alert('Akses belum siap. Silakan tunggu.');
    return;
  }
  if (sedangProses) return;

  kode = String(kode || '').trim();
  if (!kode) {
    tampil('<div class="title">⚠ KODE BELUM DIISI</div><div>Masukkan atau scan kode registrasi peserta.</div>', 'warn');
    return;
  }

  sedangProses = true;
  setGuide('🔍 MEMERIKSA DATA PESERTA...', '');

  try {
    const awal = await cariPesertaFirestore(kode);
    if (!awal || !awal._docId) {
      throw new Error('Peserta tidak ditemukan di koleksi peserta Firestore.');
    }

    const ref = db.collection('peserta').doc(awal._docId);
    const hasil = await db.runTransaction(async transaction => {
      const snap = await transaction.get(ref);
      if (!snap.exists) throw new Error('Data peserta sudah tidak ditemukan.');

      const data = snap.data() || {};
      const peserta = {
        ...data,
        _docId: snap.id,
        kode: data.kode || data.kodeRegistrasi || data.kodePendaftaran || snap.id
      };
      const bayar = String(data.statusPembayaran || 'BELUM LUNAS').trim().toUpperCase();
      const hadir = String(data.statusKehadiran || 'BELUM HADIR').trim().toUpperCase();

      // Peserta yang belum lunas tidak dipindahkan ke tab Sudah Hadir.
      if (bayar !== 'LUNAS') return { mode: 'belum-lunas', peserta };

      // Jika sudah hadir, cukup tampilkan data tanpa mengubahnya lagi.
      if (hadir === 'HADIR' || hadir === 'SUDAH HADIR') {
        return { mode: 'sudah', peserta };
      }

      const sekarang = new Date();
      const jamCheckIn = sekarang.toLocaleString('id-ID', {
        timeZone: 'Asia/Jakarta',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
      }) + ' WIB';

      // Perubahan inti saja: statusKehadiran membuat peserta masuk tab Sudah Hadir.
      transaction.update(ref, {
        statusKehadiran: 'HADIR'
      });

      return {
        mode: 'berhasil',
        peserta: {
          ...peserta,
          statusKehadiran: 'HADIR',
          jamCheckIn: jamCheckIn
        }
      };
    });

    await tutupKamera();

    if (hasil.mode === 'belum-lunas') {
      tampil(`<div class="title">❌ PEMBAYARAN BELUM LUNAS</div>
        <div>Check-in tidak dilakukan. Peserta harus melunasi pembayaran terlebih dahulu.</div>
        <div class="row"><span>Kode Registrasi</span><b>${esc(hasil.peserta.kode || '-')}</b></div>
        <div class="row"><span>Nama Peserta</span><b>${esc(hasil.peserta.nama || '-')}</b></div>
        <div class="row"><span>Status Pembayaran</span><b><span class="status belum">BELUM LUNAS</span></b></div>`, 'err');
      setGuide('❌ PEMBAYARAN BELUM LUNAS', 'error');
      return;
    }

    tampilData(hasil.peserta, hasil.mode);
    if (hasil.mode === 'berhasil') {
      setGuide('✓ PEMBAYARAN LUNAS — PESERTA DIPINDAHKAN KE SUDAH HADIR', 'ready');
    } else {
      setGuide('✓ PESERTA SUDAH ADA DI TAB SUDAH HADIR', 'ready');
    }
  } catch (e) {
    console.error('Gagal memproses check-in:', e);
    await tutupKamera();
    tampil('<div class="title">❌ GAGAL</div><div>' + esc(e.message || 'Terjadi kesalahan saat memproses peserta.') + '</div>', 'err');
    setGuide('❌ GAGAL MEMPROSES PESERTA', 'error');
  } finally {
    sedangProses = false;
  }
}

function tampilData(p, mode){
  const bayar = String(p.statusPembayaran || 'BELUM LUNAS').trim().toUpperCase();
  const hadir = String(p.statusKehadiran || 'BELUM HADIR').trim().toUpperCase();
  const benefit = String(p.statusBenefit || 'BELUM DIAMBIL').trim().toUpperCase();
  let cls = 'ok', title = '✓ PESERTA BERHASIL HADIR', pesanBenefit = '';

  if (mode === 'sudah') {
    cls = 'warn';
    title = '⚠ PESERTA SUDAH HADIR';
    pesanBenefit = `<div class="benefit-warning">
      Peserta ini sudah tercatat hadir sebelumnya.
      <br>Status benefit: <b>${esc(mode === 'sudah' ? 'SUDAH DIAMBIL' : (mode === 'berhasil' ? 'SUDAH DIAMBIL' : benefit))}</b>.
      <br><br><b>Jangan lakukan check-in atau berikan benefit untuk kedua kalinya.</b>
    </div>`;
  } else {
    pesanBenefit = `<div class="benefit-ok">
      ✓ PESERTA BERHASIL DICATAT HADIR.
      <br>Jam check-in telah disimpan ke Firestore.
      <br>Status benefit: <b>${esc(mode === 'berhasil' ? 'SUDAH DIAMBIL' : benefit)}</b>.
      <br>Pastikan benefit hanya diberikan satu kali.
    </div>`;
  }

  tampil(`
    <div class="title">${title}</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:12px">
      ${mode === 'sudah' ? 'Pemindaian ulang terdeteksi.' : 'Pembayaran lunas dan check-in berhasil disimpan.'}
    </div>
    <div class="row"><span>Kode Registrasi</span><b>${esc(p.kode || '-')}</b></div>
    <div class="row"><span>Nama Peserta</span><b>${esc(p.nama || '-')}</b></div>
    <div class="row"><span>Nama Toko</span><b>${esc(p.toko || p.namaToko || '-')}</b></div>
    <div class="row"><span>Alamat</span><b>${esc(p.alamat || '-')}</b></div>
    <div class="row"><span>No. WhatsApp</span><b>${esc(p.wa || p.noWhatsApp || '-')}</b></div>
    <div class="row"><span>Email</span><b>${esc(p.email || '-')}</b></div>
    <div class="row"><span>Ukuran Kaos</span><b>${esc(p.ukuran || '-')}</b></div>
    <div class="row"><span>Status Pembayaran</span><b><span class="status ${bayar === 'LUNAS' ? 'lunas' : 'belum'}">${esc(bayar)}</span></b></div>
    <div class="row"><span>Nominal Pembayaran</span><b>${p.nominalPembayaran ? rupiah(p.nominalPembayaran) : '-'}</b></div>
    <div class="row"><span>Tier Registrasi</span><b>${esc(p.tierRegistrasi || '-')}</b></div>
    <div class="row"><span>Estimasi Saat Daftar</span><b>${p.estimasiHarga ? rupiah(p.estimasiHarga) : '-'}</b></div>
    <div class="row"><span>Tier Pembayaran</span><b>${esc(p.tierPembayaran || '-')}</b></div>
    <div class="row"><span>Status Kehadiran</span><b><span class="status ${hadir === 'HADIR' ? 'hadir' : 'belumhadir'}">${esc(hadir)}</span></b></div>
    <div class="row"><span>Jam Check-in</span><b>${esc(p.jamCheckIn || p.jamCheckin || '-')}</b></div>
    ${pesanBenefit}
  `, cls);
}

function tampil(html, cls){
  const el = document.getElementById('result');
  el.className = 'result ' + cls;
  el.innerHTML = html;
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function rupiah(v){
  const n = Number(String(v).replace(/[^0-9.-]/g,''));
  return Number.isNaN(n) ? esc(v) : 'Rp ' + n.toLocaleString('id-ID');
}

document.addEventListener('DOMContentLoaded', requireStaff);
</script>
</body>
</html>
